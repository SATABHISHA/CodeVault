<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CodeVault industrial barcode and label printing suite by Ahanova AI Technologies Pvt. Ltd.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CodeVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CodeVault</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Canonicalize stale deep links from old Windows-targeted URLs.
    // Example: /windows/operations#/login -> /#/login
    (function() {
      try {
        if (window.location.pathname.startsWith('/windows')) {
          const hash =
              window.location.hash && window.location.hash.startsWith('#/')
                  ? window.location.hash
                  : '#/login';
          const query = window.location.search || '';
          window.history.replaceState(null, '', '/' + query + hash);
        }
      } catch (_) {
        // Ignore URL normalization issues and continue bootstrap.
      }
    })();

    // Build-aware cache reset. Detects every new deployment by hashing the
    // generated service-worker manifest (its resource hashes change per build)
    // and clears stale service-worker caches so returning browsers always load
    // the newest build. Self-terminating: it only reloads once per new build.
    (async function() {
      const markerKey = 'codevault.buildMarker';
      try {
        const response = await fetch('flutter_service_worker.js', { cache: 'no-store' });
        const text = await response.text();
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          hash = (hash * 31 + text.charCodeAt(i)) | 0;
        }
        const marker = String(hash);
        const stored = window.localStorage ? localStorage.getItem(markerKey) : null;
        if (stored !== marker) {
          if (window.localStorage) localStorage.setItem(markerKey, marker);
          // Only force a reset when this browser has an older build cached.
          if (stored !== null) {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((r) => r.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
            }
            window.location.reload();
            return;
          }
        }
      } catch (_) {
        // Ignore cache-reset issues and continue normal bootstrap.
      }
    })();

    // Force-activate any waiting service worker immediately so stale SW caches
    // (e.g. sqlite3.wasm cached with wrong MIME type) are replaced right away.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
      navigator.serviceWorker.ready.then(function(reg) {
        if (reg.waiting) { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
